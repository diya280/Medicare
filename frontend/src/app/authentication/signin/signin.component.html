
<div id="login_area" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50">
  <div class="bg-white w-[90%] sm:w-[500px] rounded-2xl shadow-2xl p-6 sm:p-8 relative animate-fadeIn">
    <button type="button" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800 text-xl"
      (click)="closeModal()">
      &times;
    </button>
    <div class="flex justify-center mb-1" style="margin-top: -20px">
      <img src="assets/medicare_logo/medicare_logo.png" alt="Medicare Logo"
        class="w-28 h-28 sm:w-32 sm:h-32 object-contain drop-shadow-md" />
    </div>

    <h2 class="text-2xl sm:text-3xl font-extrabold text-center text-gray-800 mb-6" style="margin-top: -20px">
      Welcome Back 👋
    </h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block font-medium text-gray-700 mb-1">Email</label>
        <input type="email" formControlName="email" placeholder="Enter your email"
          class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition" />
        <div *ngIf="f['email'].touched && f['email'].invalid" class="text-red-500 text-sm mt-1">
          Please enter a valid email.
        </div>
      </div>

      <div>
        <label class="block font-medium text-gray-700 mb-1">Password</label>
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
            placeholder="Enter your password"
            class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition pr-10" />
          <button type="button" (click)="togglePasswordVisibility()"
            class="absolute inset-y-0 right-3 flex items-center text-gray-500 hover:text-gray-800 focus:outline-none">
            <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
        <div *ngIf="f['password'].touched && f['password'].invalid" class="text-red-500 text-sm mt-1">
          Password must be at least 4 characters.
        </div>
      </div>

      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" formControlName="remember" class="accent-blue-600 w-4 h-4 rounded" />
          <span class="text-gray-600">Remember me</span>
        </label>
        <a href="#" class="text-blue-600 hover:underline font-medium">
          Forgot password?
        </a>
      </div>

      <button type="submit" [disabled]="isLoading"
        class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold rounded-lg shadow-md hover:from-blue-700 hover:to-indigo-700 transition-all duration-300">
        {{ isLoading ? "Logging in..." : "Login" }}
      </button>
    </form>

    <!-- <div class="my-6 flex items-center justify-center">
            <div class="border-t border-gray-300 w-1/4"></div>
            <span class="mx-2 text-gray-500 text-sm">or</span>
            <div class="border-t border-gray-300 w-1/4"></div>
        </div>

        <p class="text-center text-gray-700 text-sm">
            Don’t have an account?
            <a href="#" class="text-blue-600 font-semibold hover:underline" (click)="openSignUp()" >Sign up</a>
        </p> -->
  </div>
</div>
